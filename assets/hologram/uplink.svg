<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-labelledby="t d" fill="none">
<title id="t">Uplink - contact channels</title>
<desc id="d">Uplink panel: a transmitting dish and live signal waveform. Four channels: LinkedIn (in/suriyaprakashp), Stack Overflow (suriya-prakash), Docker Hub (suriya4code) and email (suriya4code@gmail.com). The clickable buttons are directly below this panel.</desc>
<style>
@font-face{font-family:'HoloDisp';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}
.f-disp{font-family:'HoloDisp','Orbitron','Eurostile','Segoe UI',Arial,sans-serif;font-weight:800}
@font-face{font-family:'HoloMono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.f-mono{font-family:'HoloMono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:500}
@font-face{font-family:'HoloSans';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.f-sans{font-family:'HoloSans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}

text{font-kerning:normal}
.glow{filter:url(#glow)}
.glow2{filter:url(#glow2)}
.blink{animation:blink 1.6s steps(2,jump-none) infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.flick{animation:flick 7s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite reverse}
.beam{animation:beam 7s cubic-bezier(.45,0,.55,1) infinite}
.shimmer{animation:shimmer 6s ease-in-out infinite}
.dash{animation:dash 2.4s linear infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flick{0%,6%,8%,10%,60%,62%,100%{opacity:1}7%,9%,61%{opacity:.72}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes beam{0%{transform:translateY(-12%);opacity:0}8%{opacity:1}70%{opacity:1}82%,100%{transform:translateY(105%);opacity:0}}
@keyframes shimmer{0%,100%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}


</style>
