<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430" width="500" height="430" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">RAG PDF GENIE</title><desc id="d">RAG PDF Genie: ask a 115-page IRS PDF questions with a fully local LLM; no API keys and the document never leaves the machine. Offline pipeline: IRS PDF, split into chunks, embed with nomic-embed-text, store in ChromaDB, multi-query rewrites, llama3.2 via Ollama answers only from the retrieved context. LangChain, Ollama, ChromaDB, Streamlit.</desc><style>@font-face{font-family:'P1Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'P1Mono';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'P1Term';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{white-space:pre}.m,.mb{font-family:'P1Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.m{font-weight:500}.mb{font-weight:800}.v{font-family:'P1Term',VT323,ui-monospace,Menlo,monospace;white-space:pre}.roll{animation:roll 7.5s linear infinite}@keyframes roll{0%{transform:translateY(-140px)}100%{transform:translateY(534px)}}.flk{animation:flk 5.3s steps(1) infinite}@keyframes flk{0%,100%{opacity:1}11%{opacity:.955}12%{opacity:1}53%{opacity:.97}54%{opacity:1}71%{opacity:.94}71.6%{opacity:1}88%{opacity:.975}89%{opacity:1}}.blink{animation:blink 1.06s steps(1) infinite}@keyframes blink{0%{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.roll{display:none}}.nd{animation:nd 6.0s linear infinite}@keyframes nd{0%,100%{opacity:.78}4%{opacity:1}12%{opacity:.78}}</style><defs>
